name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
  # Nightly on main, so there is a run per day even when nobody pushes:
  # that history is what razo's triage reads to tell a regression from a flake.
  schedule:
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      # Upload with if: always() — failing runs are the interesting ones.
      # razo-upload reads GITHUB_* env automatically (branch, commit, PR number),
      # which is what lets razo.ar post its analysis back on the pull request.
      - name: Upload to razo
        if: always()
        run: npx razo-upload --url https://razo.ar/api/ingest
        env:
          RAZO_INGEST_TOKEN: ${{ secrets.RAZO_INGEST_TOKEN }}

      # Keep the raw razo-steps.json of every run, green ones included: a green
      # run is the "last known good" a later failure gets compared against.
      # One artifact per attempt so re-runs never overwrite each other.
      - name: Keep test-results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: razo-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
